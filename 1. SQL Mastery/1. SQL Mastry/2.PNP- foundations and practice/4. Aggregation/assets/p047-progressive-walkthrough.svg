<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900" role="img" aria-labelledby="title desc">
<title id="title">Q047 progressive sample walkthrough</title><desc id="desc">Eight stages show the Products catalogue, left join expansion, normalized brand, distinct product counts, sales sums, HAVING threshold, sorted output and unit reconciliation.</desc>
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.h{font-size:25px;font-weight:700}.t{font-size:19px}.s{font-size:16px}.box{stroke:#475467;stroke-width:2;rx:16}.g{fill:#e8f5e9}.b{fill:#e8eaf6}.p{fill:#f3e5f5}.a{fill:#fff3e0}.muted{fill:#667085}</style>
<rect width="1600" height="1900" fill="#fff"/>
<text x="60" y="60" class="title">PNP Q047 · Progressive walkthrough</text><text x="60" y="100" class="t">Illustrative fixture · 🟩 Products + 🟦 OrderDetails · trace ProductID 1 and the unsold products</text>
<rect x="60" y="140" width="700" height="270" class="box g"/><text x="90" y="185" class="h">1 · Catalogue input · 8 products</text><text x="90" y="230" class="t">ID   Brand        Sale_Price</text><text x="90" y="270" class="t">1    Nova         10</text><text x="90" y="305" class="t">2    Nova         20</text><text x="90" y="340" class="t">3    Nova         30</text><text x="90" y="375" class="t">4–6  NULL         5, 6, 7</text><text x="430" y="375" class="t">7–8  Solo  8, 9</text>
<rect x="840" y="140" width="700" height="270" class="box b"/><text x="870" y="185" class="h">2 · Order lines · 5 rows</text><text x="870" y="230" class="t">Detail   ProductID   Quantity</text><text x="870" y="270" class="t">10       1            2</text><text x="870" y="305" class="t">11       1            1</text><text x="870" y="340" class="t">12       2            1</text><text x="870" y="375" class="t">13       4            2     ·     14   5   1</text>
<rect x="60" y="450" width="1480" height="300" class="box p"/><text x="90" y="495" class="h">3 · LEFT JOIN result · 9 rows</text><text x="90" y="540" class="t">Product 1 expands to two joined rows; its two order lines stay separate.</text><text x="90" y="585" class="t">🟩 ProductID   Brand     🟦 DetailID   Quantity</text><text x="90" y="625" class="t">1              Nova      10            2</text><text x="90" y="660" class="t">1              Nova      11            1</text><text x="90" y="695" class="t">2              Nova      12            1</text><text x="550" y="625" class="t">3  Nova       NULL   NULL</text><text x="550" y="660" class="t">4  NULL       13     2</text><text x="550" y="695" class="t">5  NULL       14     1</text><text x="1000" y="625" class="t">6  NULL   NULL   NULL</text><text x="1000" y="660" class="t">7  Solo   NULL   NULL</text><text x="1000" y="695" class="t">8  Solo   NULL   NULL</text>
<rect x="60" y="790" width="700" height="260" class="box a"/><text x="90" y="835" class="h">4 · Normalize + count distinct products</text><text x="90" y="880" class="t">Brand        Listed IDs      Sold IDs</text><text x="90" y="925" class="t">Nova         1, 2, 3         1, 2</text><text x="90" y="970" class="t">Unbranded    4, 5, 6         4, 5</text><text x="90" y="1015" class="t">Solo         7, 8            none</text>
<rect x="840" y="790" width="700" height="260" class="box p"/><text x="870" y="835" class="h">5 · Aggregate every order line</text><text x="870" y="880" class="t">Brand        Units        Value arithmetic</text><text x="870" y="925" class="t">Nova         4            2×10 + 1×10 + 1×20 = 50</text><text x="870" y="970" class="t">Unbranded    3            2×5 + 1×6 = 16</text><text x="870" y="1015" class="t">Solo         0            no matching lines → 0</text>
<rect x="60" y="1090" width="700" height="250" class="box a"/><text x="90" y="1135" class="h">6 · HAVING listed products ≥ 3</text><text x="90" y="1185" class="t">Nova: 3 → keep</text><text x="90" y="1230" class="t">Unbranded: 3 → keep</text><text x="90" y="1275" class="t">Solo: 2 → remove</text><text x="90" y="1315" class="s muted">The threshold is evaluated per completed brand group.</text>
<rect x="840" y="1090" width="700" height="250" class="box g"/><text x="870" y="1135" class="h">7 · Sort value descending</text><text x="870" y="1185" class="t">Brand        Listed   Sold   Units   Value</text><text x="870" y="1230" class="t">Nova         3        2      4       50</text><text x="870" y="1275" class="t">Unbranded    3        2      3       16</text>
<rect x="60" y="1380" width="1480" height="250" class="box b"/><text x="90" y="1425" class="h">8 · Reconcile the units</text><text x="90" y="1485" class="t">Input order lines: 2 + 1 + 1 + 2 + 1 = 7 units</text><text x="90" y="1535" class="t">Output report: Nova 4 + Unbranded 3 = 7 units</text><text x="90" y="1585" class="t">✓ All sample units are accounted for. Product 1 counts once as sold, but both lines add units and value.</text>
<text x="60" y="1695" class="s muted">Learner query note: COALESCE handles NULL brands. Official SQL additionally trims and maps blank strings.</text>
</svg>