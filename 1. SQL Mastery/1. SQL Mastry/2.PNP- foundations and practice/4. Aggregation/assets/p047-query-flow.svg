<text x="60" y="55" class="h">PNP Q047 · Query architecture</text>
<rect x="70" y="100" width="300" height="110" class="b g"/><text x="95" y="145" class="h">Products</text><text x="95" y="180" class="t">Catalogue defines population</text>
