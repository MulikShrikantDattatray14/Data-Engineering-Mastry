<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Q047 query architecture</title><desc id="desc">Products is the preserved catalogue side of a left join to OrderDetails, followed by brand normalization, brand grouping, aggregates, having filter, and descending sort.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#475467"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.box{stroke:#475467;stroke-width:2;rx:18}.green{fill:#e8f5e9}.blue{fill:#e8eaf6}.purple{fill:#f3e5f5}.amber{fill:#fff3e0}.line{stroke:#475467;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="1400" height="900" fill="#fff"/>
<text x="60" y="62" class="title">PNP Q047 · Query architecture and row preservation</text>
<rect x="70" y="115" width="440" height="145" class="box green"/>
<text x="100" y="158" class="head">🟩 Products · driving table</text><text x="100" y="198" class="body">One catalogue row per ProductID</text><text x="100" y="230" class="small">Must retain unsold products (3, 6, 7, 8)</text>
<rect x="890" y="115" width="440" height="145" class="box blue"/>
<text x="920" y="158" class="head">🟦 OrderDetails · optional matches</text><text x="920" y="198" class="body">One row per order line</text><text x="920" y="230" class="small">Repeated lines are retained (ProductID 1)</text>
<path d="M510 185 H890" class="line"/><text x="620" y="165" class="head">LEFT JOIN</text><text x="635" y="208" class="body">P.ProductID = OD.ProductID</text>
<rect x="260" y="330" width="880" height="125" class="box purple"/>
<text x="300" y="375" class="head">🟪 Joined row set · 9 rows in the teaching fixture</text><text x="300" y="414" class="body">One row per matching order line; one NULL-extended row for each unsold product</text>
<path d="M700 260 V330" class="line"/>
<rect x="260" y="520" width="400" height="125" class="box amber"/>
<text x="290" y="565" class="head">Normalize brand label</text><text x="290" y="605" class="body">COALESCE(Brand, 'Unbranded')</text>
<rect x="740" y="520" width="400" height="125" class="box purple"/>
<text x="770" y="565" class="head">GROUP BY brand</text><text x="770" y="605" class="body">One group per normalized label</text>
<path d="M700 455 V485 H460 V520" class="line"/><path d="M660 582 H740" class="line"/>
<rect x="70" y="710" width="390" height="130" class="box green"/>
<text x="100" y="752" class="head">Distinct product counts</text><text x="100" y="790" class="body">COUNT(DISTINCT P.ProductID)</text><text x="100" y="817" class="small">COUNT(DISTINCT OD.ProductID)</text>
<rect x="505" y="710" width="390" height="130" class="box blue"/>
<text x="535" y="752" class="head">Sales measures</text><text x="535" y="790" class="body">SUM(Quantity)</text><text x="535" y="817" class="small">SUM(Quantity × Sale_Price)</text>
<rect x="940" y="710" width="390" height="130" class="box amber"/>
<text x="970" y="752" class="head">HAVING + ORDER BY</text><text x="970" y="790" class="body">products_listed ≥ 3</text><text x="970" y="817" class="small">list_price_value DESC</text>
<path d="M940 645 V680 H265 V710" class="line"/><path d="M940 645 V680 H700 V710" class="line"/><path d="M940 645 V680 H1135 V710" class="line"/>
</svg>