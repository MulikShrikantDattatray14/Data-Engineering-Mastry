<path d="M600 210 V275" stroke="#344054" stroke-width="3"/>
<rect x="350" y="430" width="500" height="110" class="b o"/><text x="385" y="475" class="h">GROUP BY normalized brand</text><text x="385" y="510" class="t">Distinct product counts · SUM quantities · SUM line value</text>
<path d="M600 375 V430" stroke="#344054" stroke-width="3"/>
