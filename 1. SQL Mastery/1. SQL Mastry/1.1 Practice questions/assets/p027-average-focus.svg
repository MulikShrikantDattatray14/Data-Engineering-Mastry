<svg xmlns="http://www.w3.org/2000/svg" width="860" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-labelledby="title desc" height="281" viewBox="0 0 860 281"><title id="title">Why can ten orders average only five amounts?</title><desc id="desc">Maharashtra and Karnataka each have ten order IDs and a total of one thousand. Maharashtra has five known amounts and an average of 200. Karnataka has ten known amounts and an average of 100. Kerala has ten orders and no known amount. Its total and average are NULL.</desc><rect x="0" y="0" width="100%" height="100%" fill="#FFFFFF" /><text x="24" y="34" font-size="23" font-weight="700" fill="#172E47" text-anchor="start">Why can ten orders average only five amounts?</text><text x="24" y="61" font-size="16" font-weight="400" fill="#42566D" text-anchor="start">Count order IDs for the cutoff. Use known amounts for the average.</text><g role="group" aria-label="Three qualifying groups"><rect x="24.5" y="79" width="167.65" height="28" rx="3" fill="#087333" /><text x="32" y="98" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">ƒ Customers</text><rect x="193.15" y="79" width="642.35" height="28" rx="3" fill="#075BCC" /><text x="200.65" y="98" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">ƒ Orders</text><rect x="24.5" y="108" width="167.65" height="29" rx="0" fill="#C9ECCA" /><text x="32" y="126" font-size="14" font-weight="700" fill="#0B4A27" text-anchor="start">state</text><rect x="193.15" y="108" width="111.29" height="29" rx="0" fill="#CEE3FF" /><text x="296.94" y="126" font-size="14" font-weight="700" fill="#10376B" text-anchor="end">orders</text><line x1="245.66" x2="296.94" y1="129" y2="129" stroke="#10376B" stroke-width="1" /><rect x="305.44" y="108" width="186.85" height="29" rx="0" fill="#CEE3FF" /><text x="484.79" y="126" font-size="14" font-weight="700" fill="#10376B" text-anchor="end">Known amounts</text><line x1="357.95" x2="484.79" y1="129" y2="129" stroke="#10376B" 