<svg xmlns="http://www.w3.org/2000/svg" width="820" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-labelledby="title desc" height="270" viewBox="0 0 820 270"><title id="title">Why does UPI have two different shares?</title><desc id="desc">The top strip gives five orders equal width. UPI's orders 10 and 11 are two fifths of all orders. The bottom strip uses the money from each order as its width. The first two amounts total 300, or 37.5 percent of 800.</desc><rect x="0" y="0" width="100%" height="100%" fill="#FFFFFF" /><text x="26" y="37" font-size="25" font-weight="700" fill="#172E47" text-anchor="start">UPI through two denominators</text><text x="26" y="67" font-size="16" font-weight="400" fill="#42576B" text-anchor="start">Dark blue shows UPI. Each segment is one order, in OrderID order from 10 to 14.</text><text x="26" y="107" font-size="17" font-weight="700" fill="#172E47" text-anchor="start">Order share</text><text x="794" y="107" font-size="17" font-weight="700" fill="#123F75" text-anchor="end">2 of 5   ·   40.00%</text><rect x="26.6" y="116" width="152.4" height="31" rx="0" fill="#075BCC" /><text x="102.8" y="136" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text><rect x="180.2" y="116" width="152.4" height="31" rx="0" fill="#075BCC" /><text x="256.4" y="136" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">11</text><rect x="333.8" y="116" width="152.4" height="31" rx="0" fill="#CEE3FF" /><text x="410.0" y="136" font-size="14" font-weight="700" fill="#193B63" text-anchor="middle">12</text><rect x="487.4" y="116" width="152.4" height="31" rx="0" fill="#CEE3FF" /><text x="563.6" y="136" font-size="14" font-weight="700" fill="#193B63" text-anchor="middle">13</text><rect x="641.0" y="116" width="152.4" height="31" rx="0" fill="#CEE3FF" /><text x="717.2" y="136" font-size="14" font-weight="700" fill="#193B63" text-anchor="middle">14</text><text x="26" y="176" font-size="17" font-weight="700" fill="#172E47" text-anchor="start">Value share</text><text x="794" y="176" font-size="17" font-weight="700" fill="#123F75" text-anchor="end">300 of 800   ·   37.50%</text><rect x="26.6" y="185" width="94.8" height="31" rx="0" fill="#075BCC" /><text x="74.0" y="205" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">100</text><rect x="122.6" y="185" width="190.8" height="31" rx="0" fill="#075BCC" /><text x="218.0" y="205" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">200</text><rect x="314.6" y="185" width="286.8" height="31" rx="0" fill="#CEE3FF" /><text x="458.0" y="205" font-size="14" font-weight="700" fill="#193B63" text-anchor="middle">300</text><rect x="602.6" y="185" width="46.8" height="31" rx="0" fill="#CEE3FF" /><text x="626.0" y="205" font-size="14" font-weight="700" fill="#193B63" text-anchor="middle">50</text><rect x="650.6" y="185" width="142.8" height="31" rx="0" fill="#CEE3FF" /><text x="722.0" y="205" font-size="14" font-weight="700" fill="#193B63" text-anchor="middle">150</text><text x="26" y="245" font-size="15" font-weight="400" fill="#42576B" text-anchor="start">Top labels are order IDs. Bottom labels are the amounts in those same orders.</text></svg>