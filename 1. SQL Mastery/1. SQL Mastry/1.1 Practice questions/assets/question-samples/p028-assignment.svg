<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, Arial, sans-serif">
  <title id="title">PNP P028 assignment example inputs and expected output</title>
  <desc id="desc">The original PNP assignment example. Three Orders rows match two Payments rows. UPI has two orders and Card has one; both represent half the order value.</desc>
  <rect x="0" y="0" width="1040" height="590" fill="#FFFFFF"/>
  <text x="36" y="45" font-size="15" font-weight="700" fill="#445E73">PNP P028 / SUBQUERIES / ASSIGNMENT EXAMPLE</text>
  <text x="36" y="82" font-size="29" font-weight="700" fill="#14283A">Payment mix: share of orders and value</text>
  <text x="36" y="112" font-size="16" fill="#324D63">Original Example 1 · given input tables and expected output</text>
  <rect x="36" y="137" width="14" height="14" rx="2" fill="#15558D"/>
  <text x="58" y="150" font-size="15" font-weight="700" fill="#14283A">Orders</text>
  <rect x="150" y="137" width="14" height="14" rx="2" fill="#17674F"/>
  <text x="172" y="150" font-size="15" font-weight="700" fill="#14283A">Payments</text>
  <text x="36" y="171" font-size="14" fill="#52677B">Sample table key · display order: Orders, then Payments</text>
  <rect x="36" y="190" width="550" height="34" rx="3" fill="#15558D"/>
  <text x="50" y="213" font-size="16" font-weight="700" fill="#FFFFFF">Orders · 3 rows</text>
  <rect x="36" y="224" width="100" height="38" fill="#DBEBFA"/>
