  <text x="148" y="249" font-size="14" font-weight="700" fill="#123B60">PaymentID</text>
  <text x="288" y="249" font-size="14" font-weight="700" fill="#123B60">Total_Order_Amount</text>
  <g fill="#123B60" font-size="15">
    <rect x="36" y="262" width="100" height="34" fill="#F4F8FE"/><text x="48" y="284">10</text>
    <rect x="136" y="262" width="140" height="34" fill="#F4F8FE"/><text x="148" y="284">1</text>
    <rect x="276" y="262" width="310" height="34" fill="#F4F8FE"/><text x="288" y="284">100</text>
    <rect x="36" y="296" width="100" height="34" fill="#FFFFFF"/><text x="48" y="318">11</text>
    <rect x="136" y="296" width="140" height="34" fill="#FFFFFF"/><text x="148" y="318">1</text>
    <rect x="276" y="296" width="310" height="34" fill="#FFFFFF"/><text x="288" y="318">200</text>
    <rect x="36" y="330" width="100" height="34" fill="#F4F8FE"/><text x="48" y="352">12</text>
    <rect x="136" y="330" width="140" height="34" fill="#F4F8FE"/><text x="148" y="352">2</text>
    <rect x="276" y="330" width="310" height="34" fill="#F4F8FE"/><text x="288" y="352">300</text>
  </g>
  <g stroke="#C8D4DF" stroke-width="1" fill="none">
    <rect x="36" y="224" width="550" height="140"/><path d="M136 224V364 M276 224V364 M36 262H586 M36 296H586 M36 330H586"/>
  </g>
  <rect x="610" y="190" width="394" height="34" rx="3" fill="#17674F"/>
