<rect x="0" y="0" width="1160" height="8" rx="0" fill="#22654f"/>
<text x="32" y="43" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#215e49" font-weight="700">BOSSCODER  1.03    /    SQL WALKTHROUGH</text>
<text x="32" y="92" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#142a3a" font-weight="700">Binary Tree Nodes</text>
<text x="32" y="124" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#405766">One row per tree node with its role.</text>
<rect x="32" y="151" width="1096" height="101" rx="10" fill="#e6f1ec"/>
<text x="50" y="173" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#215e49" font-weight="700">PREDICT THE RESULT</text>
<text x="50" y="199" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142a3a" font-weight="700">Node 5 is both someone&#x27;s parent and has no parent of its own. Which label takes</text>
<text x="50" y="226" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142a3a" font-weight="700">precedence?</text>
<text x="32" y="290" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#142a3a" font-weight="700">Sample inputs</text>
<text x="32" y="318" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#405766">A triangle marks an example to follow. Shaded columns show what to read. SQL excerpts use … for omitted clauses.</text>
