<text x="52" y="1370" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#142a3a" font-weight="700">Which nodes never appear as a known parent?</text>
<text x="52" y="1399" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142a3a">Leaves 1, 3, 6 and 9 have no children. Look up each N against the known parent IDs.</text>
