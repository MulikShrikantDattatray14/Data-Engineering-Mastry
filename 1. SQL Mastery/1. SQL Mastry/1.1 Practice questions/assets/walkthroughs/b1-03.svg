<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="2102" viewBox="0 0 1160 2102" role="img" aria-labelledby="title desc">
<title id="title">B1.03 · Binary Tree Nodes</title>
<desc id="desc">One row per tree node with its role. Node 5 is the root. Test it first because it also appears in the list of parents. The parent IDs are 2, 5 and 8, each occurring twice. Removing NULL makes the NOT IN leaf test determinate. Leaves 1, 3, 6 and 9 have no children. Look up each N against the known parent IDs. Nodes 2 and 8 are inner nodes. One root + two inner nodes + four leaves = seven nodes, ordered by N.</desc>
