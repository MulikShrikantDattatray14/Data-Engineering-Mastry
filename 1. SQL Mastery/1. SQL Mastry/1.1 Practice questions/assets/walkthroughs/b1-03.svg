<text x="52" y="1720" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#142a3a" font-weight="700">How does CASE give each node one role?</text>
<text x="52" y="1749" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142a3a">Nodes 2 and 8 are inner nodes. One root + two inner nodes + four leaves = seven nodes, ordered by N.</text>
