<rect x="0" y="0" width="1160" height="8" rx="0" fill="#22654f"/>
<text x="32" y="43" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#215e49" font-weight="700">PNP  P015    /    SQL WALKTHROUGH</text>
<text x="32" y="92" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#142a3a" font-weight="700">Product count for every category</text>
<text x="32" y="124" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#405766">One row per category, including categories with zero products.</text>
<rect x="32" y="151" width="1096" height="74" rx="10" fill="#e6f1ec"/>
<text x="50" y="173" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#215e49" font-weight="700">PREDICT THE RESULT</text>
<text x="50" y="199" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142a3a" font-weight="700">Toys has no products. What would COUNT(*) return for its joined row?</text>
