<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1570" viewBox="0 0 1160 1570" role="img" aria-labelledby="title desc">
<title id="title">P015 · Product count for every category</title>
<desc id="desc">One row per category, including categories with zero products. Two categories become three joined rows. Snacks repeats for products 10 and 11. Toys survives with NULL in both Products columns. Snacks reads product IDs 10 and 11 → 2. Toys reads NULL → 0. Counting its whole joined row would give 1. Sort by the computed count: Toys has 0, then Snacks has 2. Category ID breaks a tie.</desc>
