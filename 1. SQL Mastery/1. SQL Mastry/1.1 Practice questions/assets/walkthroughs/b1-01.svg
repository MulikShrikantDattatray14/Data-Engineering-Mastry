<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1640" viewBox="0 0 1160 1640" role="img" aria-labelledby="title desc">
<title id="title">B1.01 · Find Customers With Positive Revenue This Year</title>
<desc id="desc">One row per customer with positive revenue in 2021. Only customers 1, 2 and 4 have a 2021 row. Customer 3 has positive numbers in earlier years. Customer 2 has −50 and drops out. Customers 1 and 4 have 30 and 20 respectively. The qualifying IDs are 1 and 4. Each appears once because customer and year form the input key. Any output order is valid. FROM Customers · one table is enough. The input records revenue for one customer in one year. Each row contains the year to test, the revenue to check and the customer ID to return.</desc>
