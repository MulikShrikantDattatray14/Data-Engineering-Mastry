<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="568" viewBox="0 0 1080 568" role="img" aria-labelledby="title desc">
<title id="title">P029. Agreed table order and join choices</title>
<desc id="desc">Orders supplies the report rows. Left join Shippers on ShipperID, then the units per order on OrderID. Order 15 has three units and no shipper match. Order 16 keeps amount 80 and has NULL joined units.</desc>
<rect x="0" y="0" width="1080" height="568" rx="0" fill="#ffffff"/>
<text x="32" y="29" font-size="15" font-family="DejaVu Sans, sans-serif" font-weight="700" fill="#075BCC">P029  /  STEP 1</text>
<text x="32" y="64" font-size="28" font-family="DejaVu Sans, sans-serif" font-weight="700" fill="#203847">Why these tables and joins?</text>
<rect x="32" y="84" width="1016" height="76" rx="5" fill="#EAF3FF"/>
<rect x="32" y="88" width="5" height="68" rx="2" fill="#075BCC"/>
<text x="47" y="109" font-size="19" font-family="DejaVu Sans, sans-serif" font-weight="700" fill="#10376B">First · FROM Orders</text>
<text x="478" y="109" font-size="15" font-family="DejaVu Sans Mono, monospace" font-weight="400" fill="#10376B">OrderID and ShipperID are available here.</text>
<text x="47" y="139" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" fill="#203847">The report counts orders and adds their amounts. Every order needs a place before either lookup.</text>
<rect x="32" y="170" width="1016" height="76" rx="5" fill="#E5F6E8"/>
<rect x="32" y="174" width="5" height="68" rx="2" fill="#087333"/>
<text x="47" y="195" font-size="19" font-family="DejaVu Sans, sans-serif" font-weight="700" fill="#0B4A27">Second · LEFT JOIN Shippers</text>
<text x="478" y="195" font-size="15" font-family="DejaVu Sans Mono, monospace" font-weight="400" fill="#0B4A27">Orders.ShipperID = Shippers.ShipperID</text>
<text x="47" y="225" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" fill="#203847">Look up the company name. A failed match keeps the order and leaves the company name NULL.</text>
<rect x="32" y="256" width="1016" height="76" rx="5" fill="#FFEDEE"/>
<rect x="32" y="260" width="5" height="68" rx="2" fill="#B91837"/>
<text x="47" y="281" font-size="19" font-family="DejaVu Sans, sans-serif" font-weight="700" fill="#75112B">Third · LEFT JOIN OrderDetails_2</text>
<text x="478" y="281" font-size="15" font-family="DejaVu Sans Mono, monospace" font-weight="400" fill="#75112B">Orders.OrderID = OrderDetails_2.OrderID</text>
<text x="47" y="311" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" fill="#203847">Each order matches at most one units total. The left join keeps the order and its amount even when it has no details.</text>
<text x="32" y="378" font-size="21" font-family="DejaVu Sans, sans-serif" font-weight="700" fill="#203847">Two extra orders from the Step 1 checks</text>
<rect x="32" y="395" width="137" height="35" rx="0" fill="#075BCC"/>
<text x="42" y="418" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="700" fill="#ffffff">Orders</text>
<rect x="32" y="432" width="137" height="37" rx="0" fill="#EAF3FF"/>
<text x="42" y="456" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" fill="#10376B">Order 15</text>
<rect x="32" y="471" width="137" height="37" rx="0" fill="#EAF3FF"/>
<text x="42" y="495" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" fill="#10376B">Order 16</text>
<rect x="171" y="395" width="253" height="35" rx="0" fill="#087333"/>
<text x="181" y="418" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="700" fill="#ffffff">Shippers</text>
<rect x="171" y="432" width="253" height="37" rx="0" fill="#E5F6E8"/>
<text x="181" y="456" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" fill="#0B4A27">No match → NULL</text>
<rect x="171" y="471" width="253" height="37" rx="0" fill="#E5F6E8"/>
<text x="181" y="495" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" fill="#0B4A27">Matched company</text>
<rect x="426" y="395" width="198" height="35" rx="0" fill="#B91837"/>
<text x="436" y="418" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="700" fill="#ffffff">OrderDetails_2</text>
<rect x="426" y="432" width="198" height="37" rx="0" fill="#FFEDEE"/>
<text x="436" y="456" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" fill="#75112B">3 units</text>
<rect x="426" y="471" width="198" height="37" rx="0" fill="#FFEDEE"/>
<text x="436" y="495" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" fill="#75112B">No match → NULL</text>
<rect x="626" y="395" width="420" height="35" rx="0" fill="#425867"/>
<text x="636" y="418" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="700" fill="#ffffff">After both joins</text>
<rect x="626" y="432" width="420" height="37" rx="0" fill="#eff3f6"/>
<text x="636" y="456" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" fill="#203847">Kept · reported as Unknown shipper</text>
<rect x="626" y="471" width="420" height="37" rx="0" fill="#eff3f6"/>
<text x="636" y="495" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" fill="#203847">Kept · order amount stays 80</text>
<text x="32" y="542" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" fill="#203847">Both lookup keys come from Orders, so these two lookups can also be performed in the opposite order.</text>
</svg>
