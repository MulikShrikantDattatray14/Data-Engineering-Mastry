<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1203" viewBox="0 0 1160 1203" role="img" aria-labelledby="title desc">
<title id="title">P020 · Days to ship and days to deliver</title>
<desc id="desc">One row per November 2025 order. Order 3 was placed in October even though it shipped in November. Orders 1 and 2 qualify. For order 1, November 3 minus 1 = 2 days to ship and November 6 minus 1 = 5 to deliver. Order 2 keeps two NULLs. FROM Orders · one table is enough. Placement, shipment and delivery dates belong to the same order. Keeping that row gives order 2 a place in the report even while its later dates are missing.</desc>
