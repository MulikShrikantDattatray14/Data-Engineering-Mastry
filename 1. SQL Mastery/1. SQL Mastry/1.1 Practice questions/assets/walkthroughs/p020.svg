<text x="52" y="556" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#142a3a" font-weight="700">Which date decides whether an order qualifies?</text>
<text x="52" y="585" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142a3a">Order 3 was placed in October even though it shipped in November. Orders 1 and 2 qualify.</text>
<rect x="52" y="601" width="1056" height="35" rx="5" fill="#f0f4f6"/>
<text x="64" y="622" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#25495e">WHERE strftime(&#x27;%m&#x27;, OrderDate) = &#x27;11&#x27; AND strftime(&#x27;%Y&#x27;, OrderDate) = &#x27;2025&#x27;</text>
