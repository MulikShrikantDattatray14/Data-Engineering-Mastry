<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1110" viewBox="0 0 1160 1110" role="img" aria-labelledby="title desc">
<title id="title">P020 · Days to ship and days to deliver</title>
<desc id="desc">One row per November 2025 order. Order 3 was placed in October even though it shipped in November. Orders 1 and 2 qualify. For order 1, November 3 minus 1 = 2 days to ship and November 6 minus 1 = 5 to deliver. Order 2 keeps two NULLs.</desc>
<rect width="1160" height="1110" fill="#f4f7f7"/>
<rect x="0" y="0" width="1160" height="8" rx="0" fill="#22654f"/>
<text x="32" y="43" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#215e49" font-weight="700">PNP  P020    /    SQL WALKTHROUGH</text>
<text x="32" y="92" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#142a3a" font-weight="700">Days to ship and days to deliver</text>
<text x="32" y="124" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#405766">One row per November 2025 order.</text>
<rect x="32" y="151" width="1096" height="74" rx="10" fill="#e6f1ec"/>
<text x="50" y="173" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#215e49" font-weight="700">PREDICT THE RESULT</text>
<text x="50" y="199" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142a3a" font-weight="700">If an order has no ship date yet, what happens to its row and its day count?</text>
<text x="32" y="263" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#142a3a" font-weight="700">Sample inputs</text>
<text x="32" y="291" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#405766">A triangle marks an example to follow. Shaded columns show what to read. SQL excerpts use … for omitted clauses.</text>
