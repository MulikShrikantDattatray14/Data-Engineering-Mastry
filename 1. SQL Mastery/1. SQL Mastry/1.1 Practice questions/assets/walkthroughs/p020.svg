<text x="64" y="715" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#25495e">WHERE strftime(&#x27;%m&#x27;, OrderDate) = &#x27;11&#x27; AND strftime(&#x27;%Y&#x27;, OrderDate) = &#x27;2025&#x27;</text>
