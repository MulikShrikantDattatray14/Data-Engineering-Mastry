<text x="66" y="589" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#194f7c" font-weight="700">FROM Orders · one table is enough</text>
<text x="66" y="613" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142a3a">Placement, shipment and delivery dates belong to the same order. Keeping that row gives order 2 a place in the report</text>
<text x="66" y="636" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#142a3a">even while its later dates are missing.</text>
