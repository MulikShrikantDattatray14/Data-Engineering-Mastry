<text x="52" y="941" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#142a3a" font-weight="700">Where does each elapsed time start?</text>
<text x="52" y="970" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142a3a">For order 1, November 3 minus 1 = 2 days to ship and November 6 minus 1 = 5 to deliver. Order 2 keeps two</text>
