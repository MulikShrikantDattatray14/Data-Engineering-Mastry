<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1383" viewBox="0 0 1160 1383" role="img" aria-labelledby="title desc">
<title id="title">P010 · Headline order KPIs</title>
<desc id="desc">One summary row for all orders. Order IDs 1, 2, 3 give three orders. Customer IDs 10, 10, 20 give two distinct buyers. 100 + 200 + 300 = 600. All three amounts are known, so 600 / 3 = 200 per order. The earliest order is January 1 and the latest is January 3. All six metrics describe the same three orders. FROM Orders · one table is enough. Each transaction contributes once to the headline figures. Its order ID, buyer ID, amount and date supply all six measures. Buyer 10 can therefore have two orders while counting as one buyer.</desc>
