<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1236" viewBox="0 0 1160 1236" role="img" aria-labelledby="title desc">
<title id="title">P005 &#183; Orders placed in Q1 2025</title>
<desc id="desc">One row per order placed in Q1 2025. Order 1 is from December and drops out. January 1 qualifies exactly at the lower boundary. March 31 stays and April 1 drops out. Orders 2 and 3 are the quarter's two orders. FROM Orders &#183; one table is enough. The date that decides eligibility and the amount to display both belong to an order. Its customer ID is already recorded on that same row.</desc>
