<title id="title">P005 · Orders placed in Q1 2025</title>
<desc id="desc">One row per order placed in Q1 2025. Order 1 is from December and drops out. January 1 qualifies exactly at the lower boundary. March 31 stays and April 1 drops out. Orders 2 and 3 are the quarter&#x27;s two orders.</desc>
