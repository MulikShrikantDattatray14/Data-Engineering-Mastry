<svg xmlns="http://www.w3.org/2000/svg" width="680" height="268" viewBox="0 0 680 268" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-labelledby="f-title f-desc"><title id="f-title">Why count distinct order IDs?</title><desc id="f-desc">The two marked Drinks lines both have OrderID 100. They contribute one order to Drinks. The third line belongs to Snacks.</desc><rect x="0" y="0" width="680" height="268" rx="0" fill="#FFFFFF" /><text x="22" y="31" font-size="22" font-weight="700" fill="#172E47" text-anchor="start">Why count distinct order IDs?</text><text x="22" y="57" font-size="16" font-weight="400" fill="#344A60" text-anchor="start">One order can contain several lines in the same category.</text><g role="group" aria-label="Drinks order lines"><rect x="22.5" y="74" width="399.91" height="28" rx="3" fill="#075BCC" /><text x="30" y="93" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">OrderDetails</text><rect x="423.41" y="74" width="234.09" height="28" rx="3" fill="#6432A5" /><text x="428.91" y="93" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">ƒ</text><rect x="444.91" y="78" width="25" height="20" rx="3" fill="#C9ECCA" /><text x="457.41" y="92" font-size="13" font-weight="700" fill="#0B4A27" text-anchor="middle">p</text><text x="472.91" y="92" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="start">+</text><rect x="485.91" y="78" width="25" height="20" rx="3" fill="#FFD2D5" /><text x="498.41" y="92" font-size="13" font-weight="700" fill="#75112B" text-anchor="middle">c</text><rect x="22.5" y="103" width="222.89" height="29" rx="0" fill="#CEE3FF" /><text x="237.89" y="121" font-size="14" font-weight="700" fill="#10376B" text-anchor="end">OrderDetailID</text><rect x="246.39" y="103" width="176.03" height="29" rx="0" fill="#CEE3FF" /><text x="414.91" y="121" font-size="14" font-weight="700" fill="#10376B" text-anchor="end">OrderID</text><line x1="352.85" x2="414.91" y1="124" y2="124" stroke="#10376B" 