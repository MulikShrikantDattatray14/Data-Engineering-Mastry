<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2380" viewBox="0 0 1440 2380" role="img" aria-labelledby="title desc">
<title id="title">P034 progressive visual walkthrough from source rows to supplier shares</title>
<desc id="desc">Five stages show supplier and order detail inputs, full outer join preservation, COALESCE identity resolution, grouping and quantity aggregation, and final percentage calculation and sorting. Uses green for Suppliers, blue for OrderDetails, and purple for combined results.</desc>
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#203047}.h1{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#50647a}.h2{font-size:23px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.tiny{font-size:13px}.green{fill:#0b6b35}.blue{fill:#075bbb}.purple{fill:#6232a3}.white{fill:#fff;font-weight:700}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.ghead{fill:#0b6b35}.bhead{fill:#075bbb}.phead{fill:#6232a3}.gcell{fill:#e4f4e8}.bcell{fill:#e7f1ff}.pcell{fill:#f0eaff}.muted{fill:#64748b}.focus{stroke:#e28a19;stroke-width:3;fill:none}
</style></defs>
<rect width="1440" height="2380" fill="#f7f9fc"/>
<text x="48" y="58" class="small" font-weight="700" fill="#52677e">PNP P034 / AGGREGATION + FULL OUTER JOIN</text>
<text x="48" y="105" class="h1">From supplier records to each supplier’s share</text>

<text x="48" y="137" class="small">Suppliers is first to retain zero-order suppliers; FULL OUTER JOIN also keeps unknown order-line IDs.</text>
<rect x="48" y="160" width="190" height="30" rx="6" fill="#0b6b35"/><text x="60" y="181" class="small white">Suppliers · green</text>
<rect x="252" y="160" width="210" height="30" rx="6" fill="#075bbb"/><text x="264" y="181" class="small white">OrderDetails · blue</text>
<rect x="476" y="160" width="235" height="30" rx="6" fill="#6232a3"/><text x="488" y="181" class="small white">Combined / calculated · purple</text>
<text x="48" y="225" class="h2">1 · Start with the two source tables</text>
<rect x="48" y="246" width="590" height="42" rx="5" class="ghead"/><text x="66" y="274" class="white body">Suppliers · 3 rows</text>
<rect x="48" y="288" width="590" height="36" class="gcell"/><text x="66" y="312" class="small" font-weight="700">SupplierID</text><text x="280" y="312" class="small" font-weight="700">CompanyName</text>
<g class="body"><rect x="48" y="324" width="590" height="38" class="gcell"/><text x="66" y="349">1</text><text x="280" y="349">Alpha</text><rect x="48" y="362" width="590" height="38" class="gcell"/><text x="66" y="387">2</text><text x="280" y="387">Beta</text><rect x="48" y="400" width="590" height="38" class="gcell"/><text x="66" y="425">3</text><text x="280" y="425">Gamma</text></g>
<rect x="680" y="246" width="712" height="42" rx="5" class="bhead"/><text x="698" y="274" class="white body">OrderDetails · 4 rows</text>
<rect x="680" y="288" width="712" height="36" class="bcell"/><text x="698" y="312" class="tiny" font-weight="700">OrderDetailID</text><text x="890" y="312" class="tiny" font-weight="700">SupplierID</text><text x="1100" y="312" class="tiny" font-weight="700">Quantity</text>
<g class="body"><rect x="680" y="324" width="712" height="38" class="bcell"/><text x="698" y="349">1</text><text x="890" y="349">1</text><text x="1100" y="349">2</text><rect x="680" y="362" width="712" height="38" class="bcell"/><text x="698" y="387">2</text><text x="890" y="387">1</text><text x="1100" y="387">3</text><rect x="680" y="400" width="712" height="38" class="bcell"/><text x="698" y="425">3</text><text x="890" y="425">2</text><text x="1100" y="425">5</text><rect x="680" y="438" width="712" height="38" class="bcell"/><text x="698" y="463">4</text><text x="890" y="463">99</text><text x="1100" y="463">4</text></g>
<text x="48" y="510" class="sub">Total quantity branch: 2 + 3 + 5 + 4 = 14 units across every OrderDetails row, including unknown SupplierID 99.</text>
<path d="M720 535 V565" stroke="#718096" stroke-width="3"/><path d="M710 555 L720 568 L730 555" fill="none" stroke="#718096" stroke-width="3"/>
<text x="48" y="605" class="h2">2 · FULL OUTER JOIN on SupplierID</text>
<text x="48" y="633" class="sub">Keep unmatched rows from both sides: unknown order-line supplier 99 and supplier Gamma with no order lines.</text>
<rect x="48" y="655" width="1344" height="40" rx="5" class="phead"/><text x="66" y="682" class="white body">Joined rows · 5 total (4 order lines + 1 unmatched supplier)</text>
<rect x="48" y="695" width="1344" height="36" class="pcell"/><text x="66" y="719" class="tiny" font-weight="700">S.SupplierID</text><text x="270" y="719" class="tiny" font-weight="700">CompanyName</text><text x="560" y="719" class="tiny" font-weight="700">OD.SupplierID</text><text x="820" y="719" class="tiny" font-weight="700">OrderDetailID</text><text x="1110" y="719" class="tiny" font-weight="700">Quantity</text>
<g class="body"><rect x="48" y="731" width="1344" height="38" class="pcell"/><text x="66" y="756">1</text><text x="270" y="756">Alpha</text><text x="560" y="756">1</text><text x="820" y="756">1</text><text x="1110" y="756">2</text><rect x="48" y="769" width="1344" height="38" class="pcell"/><text x="66" y="794">1</text><text x="270" y="794">Alpha</text><text x="560" y="794">1</text><text x="820" y="794">2</text><text x="1110" y="794">3</text><rect x="48" y="807" width="1344" height="38" class="pcell"/><text x="66" y="832">2</text><text x="270" y="832">Beta</text><text x="560" y="832">2</text><text x="820" y="832">3</text><text x="1110" y="832">5</text><rect x="48" y="845" width="1344" height="38" class="pcell"/><text x="66" y="870" font-weight="700">NULL</text><text x="270" y="870" font-weight="700">NULL</text><text x="560" y="870" font-weight="700">99</text><text x="820" y="870">4</text><text x="1110" y="870">4</text><rect x="48" y="883" width="1344" height="38" class="pcell"/><text x="66" y="908">3</text><text x="270" y="908">Gamma</text><text x="560" y="908">NULL</text><text x="820" y="908">NULL</text><text x="1110" y="908">NULL</text></g>
<rect x="48" y="845" width="1344" height="38" class="focus"/>
<rect x="48" y="883" width="1344" height="38" class="focus"/>
<text x="48" y="951" class="small muted">Orange outlines: ID 99 survives from OrderDetails; Gamma survives from Suppliers. No required row is discarded.</text>
<path d="M720 970 V1000" stroke="#718096" stroke-width="3"/><path d="M710 990 L720 1003 L730 990" fill="none" stroke="#718096" stroke-width="3"/>
<text x="48" y="1040" class="h2">3 · Resolve identity and display name with COALESCE</text>
<text x="48" y="1068" class="sub">SupplierID = COALESCE(S.SupplierID, OD.SupplierID) · CompanyName = COALESCE(S.CompanyName, 'Unknown supplier')</text>
<rect x="48" y="1090" width="1344" height="40" rx="5" class="phead"/><text x="66" y="1117" class="white body">Resolved rows · still 5</text>
<rect x="48" y="1130" width="1344" height="36" class="pcell"/><text x="66" y="1154" class="tiny" font-weight="700">SupplierID</text><text x="360" y="1154" class="tiny" font-weight="700">CompanyName</text><text x="850" y="1154" class="tiny" font-weight="700">OrderDetailID</text><text x="1110" y="1154" class="tiny" font-weight="700">Quantity</text>
<g class="body"><rect x="48" y="1166" width="1344" height="38" class="pcell"/><text x="66" y="1191">1</text><text x="360" y="1191">Alpha</text><text x="850" y="1191">1</text><text x="1110" y="1191">2</text><rect x="48" y="1204" width="1344" height="38" class="pcell"/><text x="66" y="1229">1</text><text x="360" y="1229">Alpha</text><text x="850" y="1229">2</text><text x="1110" y="1229">3</text><rect x="48" y="1242" width="1344" height="38" class="pcell"/><text x="66" y="1267">2</text><text x="360" y="1267">Beta</text><text x="850" y="1267">3</text><text x="1110" y="1267">5</text><rect x="48" y="1280" width="1344" height="38" class="pcell"/><text x="66" y="1305" font-weight="700">99</text><text x="360" y="1305" font-weight="700">Unknown supplier</text><text x="850" y="1305">4</text><text x="1110" y="1305">4</text><rect x="48" y="1318" width="1344" height="38" class="pcell"/><text x="66" y="1343">3</text><text x="360" y="1343">Gamma</text><text x="850" y="1343">NULL</text><text x="1110" y="1343">NULL</text></g>
<text x="48" y="1385" class="small muted">Unknown SupplierID 99 is now a named output group. Gamma remains a valid supplier with no activity.</text>
<path d="M720 1405 V1435" stroke="#718096" stroke-width="3"/><path d="M710 1425 L720 1438 L730 1425" fill="none" stroke="#718096" stroke-width="3"/>
<text x="48" y="1475" class="h2">4 · GROUP BY resolved SupplierID + CompanyName</text>
<text x="48" y="1503" class="sub">SUM(Quantity) per supplier · COALESCE changes Gamma’s missing aggregate to 0</text>
<rect x="48" y="1525" width="1344" height="40" rx="5" class="phead"/><text x="66" y="1552" class="white body">Grouped result · 4 supplier groups</text>
<rect x="48" y="1565" width="1344" height="36" class="pcell"/><text x="66" y="1589" class="tiny" font-weight="700">SupplierID</text><text x="360" y="1589" class="tiny" font-weight="700">CompanyName</text><text x="850" y="1589" class="tiny" font-weight="700">OrderDetailIDs</text><text x="1190" y="1589" class="tiny" font-weight="700">units_supplied</text>
<g class="body"><rect x="48" y="1601" width="1344" height="42" class="pcell"/><text x="66" y="1628">1</text><text x="360" y="1628">Alpha</text><text x="850" y="1628">1, 2</text><text x="1190" y="1628" font-weight="700">5</text><rect x="48" y="1643" width="1344" height="42" class="pcell"/><text x="66" y="1670">2</text><text x="360" y="1670">Beta</text><text x="850" y="1670">3</text><text x="1190" y="1670" font-weight="700">5</text><rect x="48" y="1685" width="1344" height="42" class="pcell"/><text x="66" y="1712">99</text><text x="360" y="1712">Unknown supplier</text><text x="850" y="1712">4</text><text x="1190" y="1712" font-weight="700">4</text><rect x="48" y="1727" width="1344" height="42" class="pcell"/><text x="66" y="1754">3</text><text x="360" y="1754">Gamma</text><text x="850" y="1754">No matching line</text><text x="1190" y="1754" font-weight="700">0</text></g>
<text x="48" y="1800" class="small muted">Reconciliation: 5 + 5 + 4 + 0 = 14 units, matching the independent total quantity CTE.</text>
<path d="M720 1820 V1850" stroke="#718096" stroke-width="3"/><path d="M710 1840 L720 1853 L730 1840" fill="none" stroke="#718096" stroke-width="3"/>
<text x="48" y="1890" class="h2">5 · Calculate share, round, then sort units DESC</text>
<text x="48" y="1918" class="sub">pct_of_units = units_supplied × 100.0 ÷ total_quantity (14) · ROUND(..., 2)</text>
<rect x="48" y="1940" width="1344" height="40" rx="5" class="phead"/><text x="66" y="1967" class="white body">Final learner-query output · 4 rows</text>
<rect x="48" y="1980" width="1344" height="36" class="pcell"/><text x="66" y="2004" class="tiny" font-weight="700">SupplierID</text><text x="300" y="2004" class="tiny" font-weight="700">CompanyName</text><text x="800" y="2004" class="tiny" font-weight="700">units_supplied</text><text x="1130" y="2004" class="tiny" font-weight="700">pct_of_units</text>
<g class="body"><rect x="48" y="2016" width="1344" height="42" class="pcell"/><text x="66" y="2043">1</text><text x="300" y="2043">Alpha</text><text x="800" y="2043">5</text><text x="1130" y="2043" font-weight="700">35.71</text><rect x="48" y="2058" width="1344" height="42" class="pcell"/><text x="66" y="2085">2</text><text x="300" y="2085">Beta</text><text x="800" y="2085">5</text><text x="1130" y="2085" font-weight="700">35.71</text><rect x="48" y="2100" width="1344" height="42" class="pcell"/><text x="66" y="2127">99</text><text x="300" y="2127">Unknown supplier</text><text x="800" y="2127">4</text><text x="1130" y="2127" font-weight="700">28.57</text><rect x="48" y="2142" width="1344" height="42" class="pcell"/><text x="66" y="2169">3</text><text x="300" y="2169">Gamma</text><text x="800" y="2169">0</text><text x="1130" y="2169" font-weight="700">0.00</text></g>
<rect x="48" y="2208" width="1344" height="90" rx="8" fill="#edf2f8" stroke="#cbd5e1"/><text x="72" y="2242" class="body" font-weight="700">Final checks</text><text x="72" y="2270" class="small">• All 4 order lines remain represented, including unknown SupplierID 99.</text><text x="720" y="2270" class="small">• Gamma remains with zero units; all supplier shares use the same denominator 14.</text><text x="72" y="2290" class="small">• Rounded percentages total 99.99%; unrounded shares total 100%.</text>
</svg>