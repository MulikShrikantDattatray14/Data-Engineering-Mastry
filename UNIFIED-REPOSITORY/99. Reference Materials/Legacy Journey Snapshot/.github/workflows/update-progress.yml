name: Refresh learning progress dashboard
on:
  push:
    branches: [main]
    paths:
      - 'progress/daily-progress.json'
      - 'scripts/render_progress.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render dashboard
        run: python scripts/render_progress.py
      - name: Commit refreshed dashboard
        run: |
          if git diff --quiet -- PROGRESS-DASHBOARD.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROGRESS-DASHBOARD.md
          git commit -m "docs(progress): refresh study progress bars"
          git push
