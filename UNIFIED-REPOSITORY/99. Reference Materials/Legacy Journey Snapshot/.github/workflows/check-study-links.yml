name: Check study and dashboard links

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'dashboard/**'
      - 'progress/daily-progress.json'
      - 'scripts/check_study_links.py'
      - '.github/workflows/check-study-links.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'dashboard/**'
      - 'progress/daily-progress.json'
      - 'scripts/check_study_links.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify relative and GitHub study links
        run: python scripts/check_study_links.py
