<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="290" viewBox="0 0 1120 290" role="img" aria-labelledby="t d">
<title id="t">Python sales slice with a step of two</title>
<desc id="d">Seven array items indexed zero to six. Indexes zero, two, four, six are selected, with values 100, 300, 500 and 700.</desc>
<rect width="1120" height="290" rx="18" fill="#0f172a"/>
<text x="28" y="44" font-family="Arial,sans-serif" font-size="23" fill="#f8fafc" font-weight="700">sales[::2] — select indexes 0, 2, 4, 6</text>
<rect x="25" y="70" width="142" height="120" rx="12" fill="#123a32" stroke="#22c55e" stroke-width="2"/><text x="96" y="103" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">index 0</text><text x="96" y="146" fill="#f8fafc" font-family="Arial,sans-serif" font-size="30" font-weight="bold" text-anchor="middle">100</text><text x="96" y="174" fill="#4ade80" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">✓ selected</text><rect x="180" y="70" width="142" height="120" rx="12" fill="#182235" stroke="#64748b" stroke-width="2"/><text x="251" y="103" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">index 1</text><text x="251" y="146" fill="#f8fafc" font-family="Arial,sans-serif" font-size="30" font-weight="bold" text-anchor="middle">200</text><text x="251" y="174" fill="#94a3b8" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">— skipped</text><rect x="335" y="70" width="142" height="120" rx="12" fill="#123a32" stroke="#22c55e" stroke-width="2"/><text x="406" y="103" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">index 2</text><text x="406" y="146" fill="#f8fafc" font-family="Arial,sans-serif" font-size="30" font-weight="bold" text-anchor="middle">300</text><text x="406" y="174" fill="#4ade80" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">✓ selected</text><rect x="490" y="70" width="142" height="120" rx="12" fill="#182235" stroke="#64748b" stroke-width="2"/><text x="561" y="103" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">index 3</text><text x="561" y="146" fill="#f8fafc" font-family="Arial,sans-serif" font-size="30" font-weight="bold" text-anchor="middle">400</text><text x="561" y="174" fill="#94a3b8" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">— skipped</text><rect x="645" y="70" width="142" height="120" rx="12" fill="#123a32" stroke="#22c55e" stroke-width="2"/><text x="716" y="103" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">index 4</text><text x="716" y="146" fill="#f8fafc" font-family="Arial,sans-serif" font-size="30" font-weight="bold" text-anchor="middle">500</text><text x="716" y="174" fill="#4ade80" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">✓ selected</text><rect x="800" y="70" width="142" height="120" rx="12" fill="#182235" stroke="#64748b" stroke-width="2"/><text x="871" y="103" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">index 5</text><text x="871" y="146" fill="#f8fafc" font-family="Arial,sans-serif" font-size="30" font-weight="bold" text-anchor="middle">600</text><text x="871" y="174" fill="#94a3b8" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">— skipped</text><rect x="955" y="70" width="142" height="120" rx="12" fill="#123a32" stroke="#22c55e" stroke-width="2"/><text x="1026" y="103" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">index 6</text><text x="1026" y="146" fill="#f8fafc" font-family="Arial,sans-serif" font-size="30" font-weight="bold" text-anchor="middle">700</text><text x="1026" y="174" fill="#4ade80" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">✓ selected</text>
<text x="28" y="231" fill="#94a3b8" font-family="Arial,sans-serif" font-size="19">Start at 0 → jump +2 → jump +2 → jump +2</text>
<text x="28" y="263" fill="#4ade80" font-family="Arial,sans-serif" font-size="21" font-weight="700">Output: [100, 300, 500, 700]</text></svg>